[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orthoshift"
version = "0.1.0"
description = "Double machine learning for treatment effects under covariate shift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["causal-inference", "double-machine-learning", "treatment-effects", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/orthoshift"

[tool.hatch.build.targets.wheel]
packages = ["orthoshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
